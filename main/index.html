<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çağlıyangil · Mehmet & Maria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="split">
    <picture>
      <source media="(max-width: 720px)" srcset="./assets/IMG_0153.jpg" />
      <img src="./assets/IMG_4780.jpg" alt="Mehmet and Maria" class="hero" />
    </picture>

    <div class="overlay" aria-hidden="true"></div>

    <span class="brand">Çağlıyangil</span>

    <a class="half half-left desktop-only" href="https://mehmet.cagliyangil.com" aria-label="Mehmet's page"></a>

    <section class="center">

      </p>
      <div class="ctas">
        <a class="cta cta-mehmet" href="https://mehmet.cagliyangil.com">
          <span class="cta-label">Mehmet</span>
          <span class="cta-sub">Product Manager</span>
        </a>
        <a class="cta cta-maria" href="https://maria.cagliyangil.com">
          <span class="cta-label">Maria</span>
          <span class="cta-sub">Influencer Marketing</span>
        </a>
      </div>
    </section>

    <footer class="hints desktop-only">
      <span class="hint hint-left">← Mehmet</span>
      <span class="hint hint-right">Maria →</span>
    </footer>
  </main>

</html>
